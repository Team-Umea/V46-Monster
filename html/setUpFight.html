<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/common/normalize.css" />
    <link rel="stylesheet" href="../css/common/components.css" />
    <link rel="stylesheet" href="../css/common/common.css" />
    <link rel="stylesheet" href="../css/monster.css" />
    <link rel="stylesheet" href="../css/fight.css">
    <link rel="stylesheet" href="../css/setUpFight.css" />
  </head>
  <body>
    <main>
      <div id="userTeam" class="userTeam">
        <h2 id="legend" class="legend">Select Your Team</h2>
        <h3 id="selectedTeam" class="selectedTeam"></h3>
        <select id="availableTeams" class="availableTeams"></select>
        <div id="userTeamMonsters" class="userTeamMonsters"></div>
      </div>
      <div id="fightBtnContainer" class="fightBtnContainer">
        <img id="fightBtn" class="fightBtn icon icon-scale hidden" src="../res/icons/sword.svg" alt="Fight" title="Fight" role="button" tabindex="0">
      </div>
      <div id="opposingTeam" class="opposingTeam">
        <h2 id="opposingTeamHeader" class="opposingTeamHeader">Select Opposing Team</h2>
        <ul id="opposingTeamList" class="opposingTeamList"></ul>
        <div id="opposingTeamMonters" class="opposingTeamMonters"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li title="Home">
            <a href="../html/index.html">
              <img src="../res/icons/home.svg" alt="Home" class="icon" />
              <p>Home</p>
            </a>
          </li>

          <li title="Monsters">
            <a href="../html/monster.html">
              <img src="../res/icons/skull.svg" alt="Monsters" class="icon" />
              <p>Monsters</p>
            </a>
          </li>

          <li title="Teams">
            <a href="../html/team.html">
              <img src="../res/icons/teams.svg" alt="Teams" class="icon" />
              <p>Teams</p>
            </a>
          </li>

          <li title="Fight">
            <a href="../html/setUpFight.html">
              <img src="../res/icons/shield.svg" alt="Fight" class="icon" />
              <p>Fight</p>
            </a>
          </li>

          <li title="Achievements">
            <a href="../html/index.html">
              <img src="../res/icons/sparkles.svg" alt="Achievements" class="icon" />
              <p>Achievements</p>
            </a>
          </li>

          <li title="Elements">
            <a href="../html/element.html">
              <img src="../res/icons/element.svg" alt="Elements" class="icon" />
              <p>Elements</p>
            </a>
          </li>

          <li title="Clans">
            <a href="../html/index.html">
              <img src="../res/icons/clans.svg" alt="Clans" class="icon" />
              <p>Clans</p>
            </a>
          </li>

          <li title="Marketplace">
            <a href="../html/index.html">
              <img src="../res/icons/market.svg" alt="Marketplace" class="icon" />
              <p>Marketplace</p>
            </a>
          </li>

          <li title="Messages">
            <a href="../html/index.html">
              <img src="../res/icons/message.svg" alt="Messages" class="icon" />
              <p>Messages</p>
            </a>
          </li>

          <li title="Account">
            <a href="../html/index.html">
              <img src="../res/icons/account.svg" alt="Account" class="icon icon-scale" />
              <p>Account</p>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="module" src="../js/setUpFight.js"></script>

</html>
