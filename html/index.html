<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/monsters.css" />
    <link rel="stylesheet" href="../css/teams.css" />
  </head>
  <body>
    <main>
      <div id="createTeam" class="createTeamContainer">
        <h2>Create Your Team</h2>
        <form>
          <input type="text" placeholder="Enter a team name" id="teamNameInput" />
          <button type="submit">Create Team</button>
        </form>
        <p id="createTeamMessage" class="hidden"></p>
      </div>
      <div>
        <input type="text" id="searchBox" />
        <div id="searchCategory">
          <input type="radio" id="nameSearch" name="searchBtn" checked />
          <label for="nameSearch">Name</label>
          <input type="radio" id="strengthSearch" name="searchBtn" />
          <label for="strengthSearch">Strength</label>
          <input type="radio" id="weaknessSearch" name="searchBtn" />
          <label for="weaknessSearch">Weakness</label>
        </div>
        <label for="sortDropdown">Sort by:</label>
        <select name="sortDropdown" id="sortDropdown">
          <option value="0">A-Z</option>
          <option value="1">Z-A</option>
          <option value="2">lo-hi Price</option>
          <option value="3">hi-lo Price</option>
          <option value="4">lo-hi HP</option>
          <option value="5">hi-lo HP</option>
          <option value="6">lo-hi Damage</option>
          <option value="7">hi-lo Damage</option>
        </select>
        <button id="loadMoreMonsters">Load more</button>
      </div>
      <div id="monstersWrapper">
        <h2>Choose your fighters</h2>
        <div id="monsterContainer"></div>
      </div>
      <div id="teamsContainer" class="hidden temp"></div>
    </main>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
