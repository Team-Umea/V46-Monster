<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/common/normalize.css" />
    <link rel="stylesheet" href="../css/common/components.css" />
    <link rel="stylesheet" href="../css/common/common.css" />
    <link rel="stylesheet" href="../css/monster.css" />
    <link rel="stylesheet" href="../css/fight.css" />
  </head>
  <body>
    <main>
      <!-- <div id="teamsStatsContainer" class="teamsStatsContainer"></div> -->

      <div id="teamsContainer" class="teamsContainer">
        <div id="teamsContainerHeading" class="teamsContainerHeading">
          <h2 id="teamsContainerHeader" class="teamsContainerHeader alignCenter">Head to Head</h2>
          <img src="../res/icons/upArrow.svg" alt="Hide head to head stats" title="Hide head to head stats" role="button" tabindex="0" id="teamsContainerToggle" class="teamsContainerToggle icon icon-scale" />
        </div>

        <div id="teamsContainerBody" class="teamsContainerBody">
          <div id="teamOne" class="teamOne team">
            <h2 class="teamName teamOneName"></h2>
            <img src="../res/icons/skull.svg" alt="Show team monsters" title="Show team monsters" role="button" tabindex="0" class="teamMonsterToggle icon icon-scale" />
            <div class="teamInfo">
              <div class="teamStats"></div>
              <div class="teamMonsters teamOneMonsters">
                <div class="monsterInfo row-reverse">
                  <div class="monsterStats"></div>
                  <div class="monsters"></div>
                </div>
                <div class="monsterFought"></div>
              </div>
            </div>
          </div>

          <img src="../res/img/vs.png" alt="vs" id="vs" class="vs" />

          <div id="teamTwo" class="teamTwo team">
            <h2 class="teamName teamTwoName"></h2>
            <img src="../res/icons/skull.svg" alt="Show team monsters" title="Show team monsters" role="button" tabindex="0" class="teamMonsterToggle icon icon-scale" />
            <div class="teamInfo">
              <div class="teamStats"></div>
              <div class="teamMonsters teamTwoMonsters">
                <div class="monsterInfo">
                  <div class="monsterStats"></div>
                  <div class="monsters"></div>
                </div>
                <div class="monsterFought"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="battle" class="battle">
        <button id="fightBtn" class="fightBtn btn primary-btn">Fight</button>

        <div id="battleContainer" class="battleContainer"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li title="Home">
            <a href="../html/index.html">
              <img src="../res/icons/home.svg" alt="Home" class="icon" />
              <p>Home</p>
            </a>
          </li>

          <li title="Monsters">
            <a href="../html/monster.html">
              <img src="../res/icons/skull.svg" alt="Monsters" class="icon" />
              <p>Monsters</p>
            </a>
          </li>

          <li title="Teams">
            <a href="../html/team.html">
              <img src="../res/icons/teams.svg" alt="Teams" class="icon" />
              <p>Teams</p>
            </a>
          </li>

          <li title="Fight">
            <a href="../html/fight.html">
              <img src="../res/icons/shield.svg" alt="Fight" class="icon" />
              <p>Fight</p>
            </a>
          </li>

          <li title="Achievements">
            <a href="../html/index.html">
              <img src="../res/icons/sparkles.svg" alt="Achievements" class="icon" />
              <p>Achievements</p>
            </a>
          </li>

          <li title="Elements">
            <a href="../html/element.html">
              <img src="../res/icons/element.svg" alt="Elements" class="icon" />
              <p>Elements</p>
            </a>
          </li>

          <li title="Clans">
            <a href="../html/index.html">
              <img src="../res/icons/clans.svg" alt="Clans" class="icon" />
              <p>Clans</p>
            </a>
          </li>

          <li title="Marketplace">
            <a href="../html/index.html">
              <img src="../res/icons/market.svg" alt="Marketplace" class="icon" />
              <p>Marketplace</p>
            </a>
          </li>

          <li title="Messages">
            <a href="../html/index.html">
              <img src="../res/icons/message.svg" alt="Messages" class="icon" />
              <p>Messages</p>
            </a>
          </li>

          <li title="Account">
            <a href="../html/index.html">
              <img src="../res/icons/account.svg" alt="Account" class="icon icon-scale" />
              <p>Account</p>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="module" src="../js/fight.js"></script>
  </body>
</html>
