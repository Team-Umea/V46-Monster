<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/common/normalize.css" />
    <link rel="stylesheet" href="../css/common/components.css" />
    <link rel="stylesheet" href="../css/common/common.css" />
    <link rel="stylesheet" href="../css/monster.css" />
    <link rel="stylesheet" href="../css/teamSettings.css" />
  </head>
  <body>
    <header>
      <div id="pageInfo" class="pageInfo"></div>
      <div id="headerControls" class="headerControls">
        <img id="prevNavigator" class="prevNavigator icon icon-scale" src="../res/icons/backArrow.svg" alt="Navigate back to team page" title="Navigate back to team page" role="button" />
      </div>
      <p id="message" class="message hide">message</p>
    </header>
    <main>
      <!-- main content goes here -->
      <h2 id="defaultMessage" class="defaultMessage">Team is empty, go ahead and select monsters!</h2>

      <div id="teamControls" class="teamControls"></div>
      <div id="teamStatsConatiner" class="teamStatsConatiner border-gold"></div>
      <div id="teamMonsters" class="teamMonsters"></div>
      <div id="teamElementsContainer" class="teamElementsContainer border-gold"></div>
      <div id="battleRecordContainer" class="battleRecordContainer border-gold"></div>
      <div id="dangerZone" class="dangerZone">
        <h2 id="borderText" class="borderText">Danger zone</h2>

        <div id="deleteTeamContainer" class="deleteTeamContainer">
          <h3 id="deleteTeamHeader" class="deleteTeamHeader">Delete team</h3>

          <p id="deleteMessage" class="deleteMessage"></p>
          <div class="deleteTeamActions">
            <input type="text" id="teamName" class="teamName" placeholder=" " autocomplete="off" />
            <label for="teamName" id="teamNameLabel" class="teamNameLabel">Team name</label>
            <div id="deleteTeamBtn" class="deleteTeamBtn" role="button">
              <img src="../res/icons/trashRed.svg" alt="Delete team" title="Delete team" class="icon" />
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li title="Home">
            <a href="../html/index.html">
              <img src="../res/icons/home.svg" alt="Home" class="icon" />
              <p>Home</p>
            </a>
          </li>

          <li title="Monsters">
            <a href="../html/monster.html">
              <img src="../res/icons/skull.svg" alt="Monsters" class="icon" />
              <p>Monsters</p>
            </a>
          </li>

          <li title="Teams">
            <a href="../html/team.html">
              <img src="../res/icons/teams.svg" alt="Teams" class="icon" />
              <p>Teams</p>
            </a>
          </li>

          <li title="Fight">
            <a href="../html/fight.html">
              <img src="../res/icons/shield.svg" alt="Fight" class="icon" />
              <p>Fight</p>
            </a>
          </li>

          <li title="Achievements">
            <a href="../html/index.html">
              <img src="../res/icons/sparkles.svg" alt="Achievements" class="icon" />
              <p>Achievements</p>
            </a>
          </li>

          <li title="Elements">
            <a href="../html/element.html">
              <img src="../res/icons/element.svg" alt="Elements" class="icon" />
              <p>Elements</p>
            </a>
          </li>

          <li title="Clans">
            <a href="../html/index.html">
              <img src="../res/icons/clans.svg" alt="Clans" class="icon" />
              <p>Clans</p>
            </a>
          </li>

          <li title="Marketplace">
            <a href="../html/index.html">
              <img src="../res/icons/market.svg" alt="Marketplace" class="icon" />
              <p>Marketplace</p>
            </a>
          </li>

          <li title="Messages">
            <a href="../html/index.html">
              <img src="../res/icons/message.svg" alt="Messages" class="icon" />
              <p>Messages</p>
            </a>
          </li>

          <li title="Account">
            <a href="../html/index.html">
              <img src="../res/icons/account.svg" alt="Account" class="icon icon-scale" />
              <p>Account</p>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="module" src="../js/teamSettings.js"></script>
    <script type="module" src="../js/common/user.js"></script>
  </body>
</html>
