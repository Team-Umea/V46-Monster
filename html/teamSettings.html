<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/common/normalize.css" />
    <link rel="stylesheet" href="../css/common/components.css" />
    <link rel="stylesheet" href="../css/monster.css" />
    <link rel="stylesheet" href="../css/teamSettings.css" />
  </head>
  <body>
    <header>
      <div id="pageInfo" class="pageInfo"></div>
      <div id="headerControls" class="headerControls">
        <img id="prevNavigator" class="prevNavigator icon icon-scale" src="../res/icons/backArrow.svg" alt="Navigate back to team page" title="Navigate back to team page" role="button" />
      </div>
    </header>
    <main>
      <!-- main content goes here -->
      <div id="spinner"></div>
      <div id="teamControls" class="teamControls">
        <p id="controlMessage" class="controlMessage hide">message</p>
        <div id="controlBtns" class="controlBtns"></div>
      </div>
      <div id="teamStatsConatiner" class="teamStatsConatiner border-gold"></div>
      <div id="teamMonsters" class="teamMonsters"></div>
      <div id="teamElementsContainer" class="teamElementsContainer border-gold"></div>
      <div id="battleRecordContainer" class="battleRecordContainer border-gold"></div>
      <div id="dangerZone" class="dangerZone">
        <h2 id="borderText" class="borderText">Danger zone</h2>

        <div id="deleteTeamContainer" class="deleteTeamContainer">
          <h3 id="deleteTeamHeader" class="deleteTeamHeader">Delete team</h3>

          <p id="deleteMessage" class="deleteMessage"></p>
          <div class="deleteTeamActions">
            <input type="text" id="teamName" class="teamName" placeholder=" " autocomplete="off" />
            <label for="teamName" id="teamNameLabel" class="teamNameLabel">Team name</label>
            <div id="deleteTeamBtn" class="deleteTeamBtn" role="button">
              <img src="../res/icons/trashRed.svg" alt="Delete team" title="Delete team" class="icon" />
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <!-- footer content goes here -->
      <!-- <h2>Monster Battle Arena</h2> -->
    </footer>
    <script type="module" src="../js/teamSettings.js"></script>
    <script type="module" src="../js/common/credits.js"></script>
  </body>
</html>
