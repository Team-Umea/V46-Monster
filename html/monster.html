<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/common/normalize.css" />
    <link rel="stylesheet" href="../css/common/common.css" />
    <link rel="stylesheet" href="../css/common/spinner.css">
    <link rel="stylesheet" href="../css/monster.css" />
  </head>
  <body>
    <header>
      <!-- header content goes here -->
      <div id="headerControls">
        <img id="themeToggle" class="icon icon-scale" src="../res/icons/moon.svg" alt="Switch to darkmode" title="Switch to darkmode" role="button">
       </div>
      <h1>Welcome to monster page</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="monster.html">Monsters</a></li>
          <li><a href="team.html">Teams</a></li>
          <li><a href="fight.html">Fight</a></li>
          <li><a href="element.html">Elements</a></li>
          <li><a href="fightsRecord.html">Fight Records</a></li>
      </nav>
    </header>
    <main>
      <!-- main content goes here -->
       <!-- <button id="fetchMonsters">Fetch Monsters</button> -->
       <div id="filterCatalogueContainer">
        <h2>Filter Monsters</h2>
        <img src="../res/icons/downArrow.svg" alt="Show filters" title="Show filters" role="button" id="filterToggle" class="btnImg icon">
        <div id="searchSortContainer" class="hidden"> 
          <input type="text" id="searchBox" placeholder="Enter search query" />
          <div id="searchContainer">
            <label for="searchCategory">Select Search Category</label>
            <div id="searchCategory">
              <input type="radio" id="name" name="searchBtn" value="name" checked />
              <label for="name">Name</label>
              <input type="radio" id="health" name="searchBtn" value="health" />
              <label for="health">Health</label>
              <input type="radio" id="rank" name="searchBtn" value="rank" />
              <label for="rank">Rank</label>

              <input type="radio" id="damage" name="searchBtn" value="damage" />
              <label for="damage">Damage</label>
              <input type="radio" id="elements" name="searchBtn" value="elements" />
              <label for="elements">Elements</label>
              <input type="radio" id="price" name="searchBtn" value="price" />
              <label for="price">Price</label>
            </div>
          </div>
          <div id="sortContainer">
            <label for="sortDropdown">Select sort order</label>
            <select name="sortDropdown" id="sortDropdown"></select>
          </div>
        </div>
      </div>
      <div id="monsterContainer"></div>
      <div id="allMonsters"></div>
    </main>
    <footer>
      <!-- footer content goes here -->
      <h2>Monster Battle Arena</h2>
    </footer>
    <script type="module" src="../js/monster.js"></script>
    <script type="module" src="../js/common/theme.js"></script>
    <script type="module" src="../js/common/credits.js"></script>
  </body>
</html>
