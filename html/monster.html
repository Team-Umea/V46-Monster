<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Battle Arena</title>
    <link rel="stylesheet" href="../css/common/normalize.css" />
    <link rel="stylesheet" href="../css/common/common.css" />
    <link rel="stylesheet" href="../css/common/spinner.css" />
    <link rel="stylesheet" href="../css/monster.css" />
  </head>
  <body>
    <header>
      <div id="headerControls" class="headerControls"></div>
    </header>
    <main>
      <!-- main content goes here -->
      <!-- <button id="fetchMonsters">Fetch Monsters</button> -->
      <div id="filterCatalogueContainer">
        <h2>Filter Monsters</h2>
        <img src="../res/icons/downArrow.svg" alt="Show filters" title="Show filters" role="button" id="filterToggle" class="btnImg icon" />
        <div id="searchSortContainer" class="hidden">
          <input type="text" id="searchBox" placeholder="Enter search query" />
          <div id="searchContainer">
            <label for="searchCategory">Select Search Category</label>
            <div id="searchCategory">
              <input type="radio" id="name" name="searchBtn" value="name" checked />
              <label for="name">Name</label>
              <input type="radio" id="health" name="searchBtn" value="health" />
              <label for="health">Health</label>
              <input type="radio" id="rank" name="searchBtn" value="rank" />
              <label for="rank">Rank</label>

              <input type="radio" id="damage" name="searchBtn" value="damage" />
              <label for="damage">Damage</label>
              <input type="radio" id="price" name="searchBtn" value="price" />
              <label for="price">Price</label>
            </div>
          </div>
          <div id="sortContainer">
            <label for="sortDropdown">Select sort order</label>
            <select name="sortDropdown" id="sortDropdown"></select>
          </div>
        </div>
      </div>
      <h2 class="monsterSelectMessage" id="monsterSelectMessage"></h2>
      <div id="monsterContainer"></div>
      <div id="allMonsters"></div>

      <div id="quickScroll" class="quickScroll">
        <ul>
          <li title="Go to top" role="button" tabindex="0">
            <img src="../res/icons/upArrowBig.svg" alt="Go to top" class="icon icon-scale" />
          </li>
          <li title="-10" role="button" tabindex="0">
            <img src="../res/icons/upArrowBig.svg" alt="-10" class="icon icon-scale" />
            <p>-10</p>
          </li>
          <li title="+10" role="button" tabindex="0">
            <img src="../res/icons/downArrowBig.svg" alt="+10" class="icon icon-scale" />
            <p>+10</p>
          </li>
          <li title="-100" role="button" tabindex="0">
            <img src="../res/icons/upArrowBig.svg" alt="-100" class="icon icon-scale" />
            <p>-100</p>
          </li>
          <li title="+100" role="button" tabindex="0">
            <img src="../res/icons/downArrowBig.svg" alt="+100" class="icon icon-scale" />
            <p>+100</p>
          </li>
        </ul>
      </div>
      <div class="scrollFilter"></div>
    </main>
    <footer>
      <nav>
        <ul>
          <li title="Home">
            <a href="../html/index.html">
              <img src="../res/icons/home.svg" alt="Home" class="icon" />
              <p>Home</p>
            </a>
          </li>

          <li title="Monsters">
            <a href="../html/monster.html">
              <img src="../res/icons/skull.svg" alt="Monsters" class="icon" />
              <p>Monsters</p>
            </a>
          </li>

          <li title="Teams">
            <a href="../html/team.html">
              <img src="../res/icons/teams.svg" alt="Teams" class="icon" />
              <p>Teams</p>
            </a>
          </li>

          <li title="Fight">
            <a href="../html/fight.html">
              <img src="../res/icons/shield.svg" alt="Fight" class="icon" />
              <p>Fight</p>
            </a>
          </li>

          <li title="Achievements">
            <a href="../html/index.html">
              <img src="../res/icons/sparkles.svg" alt="Achievements" class="icon" />
              <p>Achievements</p>
            </a>
          </li>

          <li title="Elements">
            <a href="../html/element.html">
              <img src="../res/icons/element.svg" alt="Elements" class="icon" />
              <p>Elements</p>
            </a>
          </li>

          <li title="Clans">
            <a href="../html/index.html">
              <img src="../res/icons/clans.svg" alt="Clans" class="icon" />
              <p>Clans</p>
            </a>
          </li>

          <li title="Marketplace">
            <a href="../html/index.html">
              <img src="../res/icons/market.svg" alt="Marketplace" class="icon" />
              <p>Marketplace</p>
            </a>
          </li>

          <li title="Messages">
            <a href="../html/index.html">
              <img src="../res/icons/message.svg" alt="Messages" class="icon" />
              <p>Messages</p>
            </a>
          </li>

          <li title="Account">
            <a href="../html/index.html">
              <img src="../res/icons/account.svg" alt="Account" class="icon icon-scale" />
              <p>Account</p>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="module" src="../js/monster.js"></script>
    <script type="module" src="../js/common/user.js"></script>
  </body>
</html>
